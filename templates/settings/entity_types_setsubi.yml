### 設備保全向けのエンティティ種別（LightRAG 1.5.x の ENTITY_TYPE_PROMPT_FILE 用）
### RAG用Markdown作成 の「LightRAGへの入れ方」からダウンロードしたファイルです。
### 置き場所: PROMPT_DIR/entity_type/ 。.env に ENTITY_TYPE_PROMPT_FILE=このファイル名 を書きます。
### When ENTITY_EXTRACTION_USE_JSON=false, entity_extraction_examples section must include in this file
### When ENTITY_EXTRACTION_USE_JSON=true, entity_extraction_json_examples section must include in this file
### 書式はサーバーのバージョンで変わることがあります。お使いの版の prompts/samples/entity_type_prompt.sample.yml と見比べてください。

entity_types_guidance: |
  Classify each entity using one of the following types. If no type fits, use `その他`.
  Entity names must keep the original Japanese notation (including equipment codes such as CMP-101).

  - 設備: Machines, equipment and units that are maintained or repaired (e.g. CMP研磨装置1号機, 搬送ロボット2号機, 設備番号 CMP-101)
  - 部品: Parts, components and consumables that are replaced or adjusted (e.g. エンコーダケーブル, フィルター, 型番 RB-ENC-05M)
  - 不具合現象: Observed failures, symptoms and abnormal states (e.g. 搬送アーム停止, スラリー流量低下, 異音)
  - 原因: Root causes or suspected causes of a failure (e.g. コネクタの緩み, フィルター目詰まり)
  - 処置: Temporary or permanent actions taken (e.g. フィルター交換, 原点復帰, 増し締め, 流量再校正)
  - 工程/ライン: Production processes, lines and areas (e.g. L1, 研磨工程, 洗浄ライン)
  - 部署: Departments, teams and vendors in charge (e.g. 保全課, 製造1課, 装置メーカー)
  - アラーム: Alarm codes and alarm messages shown by equipment (e.g. ALM-2031, Robot Position Error)
  - その他: Anything important that does not fit the types above

entity_extraction_examples:
  - |
    entity{tuple_delimiter}CMP研磨装置1号機（CMP-101）{tuple_delimiter}設備{tuple_delimiter}研磨工程で使用する設備。2026-08-03にスラリー流量低下アラームで停止した。
    entity{tuple_delimiter}ALM-2031{tuple_delimiter}アラーム{tuple_delimiter}スラリー流量低下を示すアラーム。
    entity{tuple_delimiter}スラリー供給ラインのフィルター目詰まり{tuple_delimiter}原因{tuple_delimiter}スラリー流量が低下した原因。
    entity{tuple_delimiter}フィルター交換{tuple_delimiter}処置{tuple_delimiter}目詰まりしたフィルターを交換した処置。
    relation{tuple_delimiter}CMP研磨装置1号機（CMP-101）{tuple_delimiter}ALM-2031{tuple_delimiter}アラーム発生, 停止{tuple_delimiter}CMP研磨装置1号機でALM-2031が発生し研磨が停止した。
    relation{tuple_delimiter}ALM-2031{tuple_delimiter}スラリー供給ラインのフィルター目詰まり{tuple_delimiter}原因{tuple_delimiter}ALM-2031の原因はフィルター目詰まりだった。
    relation{tuple_delimiter}スラリー供給ラインのフィルター目詰まり{tuple_delimiter}フィルター交換{tuple_delimiter}処置{tuple_delimiter}フィルター目詰まりに対しフィルターを交換した。
    {completion_delimiter}

entity_extraction_json_examples:
