    {
      "entities": [
        {
          "name": "CMP研磨装置1号機（CMP-101）",
          "type": "設備",
          "description": "研磨工程で使用する設備。2026-08-03にスラリー流量低下アラームで停止した。"
        },
        {
          "name": "ALM-2031",
          "type": "アラーム",
          "description": "スラリー流量低下を示すアラーム。"
