{#- 読み取り結果の欄（HTML の断片）。置かれた帳票を縦に全部並べ、スクロールして確かめていく
    （利用者の指示 2026-09-20「②タブで切り替えるのではなく、全部まとめて表示する」）。 -#}

{% if items | length > 1 %}
<div class="batch-bar" data-batch-bar>
  <p class="batch-bar-text" data-batch-text aria-live="polite">{{ items | length }}件中{{ confirmed }}件を確定しました</p>
  <span class="spacer"></span>
  <button type="button" class="btn small" data-next-doc>次の帳票へ</button>
</div>
{% endif %}

<div class="review-stack{{ ' is-batch' if items | length > 1 }}" data-review-stack>
  {% for item in items %}{% include "forms/_review_block.html" %}{% endfor %}
</div>
